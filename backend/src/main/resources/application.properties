spring.application.name=collo-dreadlocks-backend

server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=collo_dreadlocks;encrypt=true;trustServerCertificate=true
spring.datasource.username=${COLLO_DB_USERNAME}
spring.datasource.password=${COLLO_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${COLLO_FLYWAY_USERNAME}
spring.flyway.password=${COLLO_FLYWAY_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
spring.flyway.validate-on-migrate=true

app.admin.email=davidsimiyu341@gmail.com
app.admin.password=${COLLO_ADMIN_PASSWORD:DevAdmin123!}

app.jwt.secret=${COLLO_JWT_SECRET:collo-dreadlocks-dev-jwt-secret-change-me-32}
app.jwt.expiration-ms=86400000

app.uploads.directory=${COLLO_UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Brevo free SMTP is 300 emails a day. Set the SMTP login and key from Brevo → SMTP & API.
# The From address must be a sender verified in that Brevo account.
app.mail.host=${COLLO_SMTP_HOST:smtp-relay.brevo.com}
app.mail.port=${COLLO_SMTP_PORT:587}
app.mail.username=${COLLO_SMTP_USERNAME:}
app.mail.password=${COLLO_SMTP_PASSWORD:}
app.mail.from=${COLLO_SMTP_FROM:}