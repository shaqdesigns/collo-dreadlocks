server.port=${PORT:8080}

spring.datasource.url=${COLLO_AIVEN_DB_URL}
spring.datasource.username=${COLLO_AIVEN_DB_USERNAME}
spring.datasource.password=${COLLO_AIVEN_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.locations=classpath:db/migration-postgresql
spring.flyway.user=${COLLO_AIVEN_DB_USERNAME}
spring.flyway.password=${COLLO_AIVEN_DB_PASSWORD}
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
